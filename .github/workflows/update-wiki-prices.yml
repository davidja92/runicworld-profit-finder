name: Refresh Wiki item and shop reference data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 2007-era Wiki-derived price reference
        run: python scripts/update_wiki_prices.py
      - name: Commit generated database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki_item_prices.json
          git diff --staged --quiet || (git commit -m 'Refresh Wiki item/shop reference database' && git push)
