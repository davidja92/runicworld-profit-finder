name: Collect RunicWorld trade volumes
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: runicworld-trade-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public market trades
        run: python scripts/collect_trades.py
      - name: Publish shared trade history and volume summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_history.json trade_volume_summary.json
          if ! git diff --staged --quiet; then
            git commit -m 'Update shared RunicWorld trade-volume observations'
            git push
          fi
